<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="style.css" rel="stylesheet">
    <title>LOGIN</title>
    <style>
        body {
            background-color: rgb(79, 228, 99);
        }
        h1 {
            color: rgb(122, 22, 216);
            text-align: center;
            font-family: cursive;
        }
        main {
            min-height: 80vh;
            padding: 20px;
        }
        form {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        form label {
            font-weight: bold;
            margin-top: 10px;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid justify-content-center">
                <a class="navbar-brand" href="#">
                    <img src="logo.png" height="100" alt="Logo">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse flex-grow-0 justify-content-center" id="navbarNav">
                    <ul class="navbar-nav text-center">
                        <li class="nav-item">
                            <a class="nav-link" href="produtos.html">PRODUTOS</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="carrinho.html">CARRINHO</a>
                        </li>
                        <li class="nav-item" id="nav-login">
                            <a class="nav-link" href="cadastro.html">LOGIN</a>
                        </li>
                    </ul>
                    <div class="dropdown m-3">
                        <button id="user-info" class="btn btn-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false" style="display: none">
                            Opções
                        </button>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="cadastro.html">Perfil</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="#" onclick="logout()">Sair</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main class="d-flex flex-column justify-content-center align-items-center">
        <form id="form_cadastro" style="width: 100%; max-width: 500px; padding: 20px; background: white; border-radius: 8px;">
        <div class="container mt-4">
            <h1>Cadastro de Clientes</h1>

                <label for="e-mail">E-mail:</label>
                <input type="email" id="e-mail" required class="form-control input_texto">

                <label for="senha">Senha:</label>
                <input type="password" id="senha" required class="form-control input_texto">

                <p class="text-center mt-3">Já possui cadastro? Faça login <a href="cadastro.html">aqui</a></p>

                <input type="submit" value="Cadastrar" id="btn_enviar" class="btn btn-primary w-100 mt-2 btn_enviar">
            </form>
        </div>
    </main>

    <footer></footer>

    <script>

        function pegar_dados(){
            const dados = {
                email: document.getElementById("e-mail").value,
                senha: document.getElementById("senha").value
            }
            return JSON.stringify(dados)
        }

        async function enviar_cadastro(){
            const btn_enviar = document.getElementById("btn_enviar");
            btn_enviar.disabled = true;
            btn_enviar.value = "Cadastrando...";
            
            const dados = pegar_dados();
            try {
                const resposta = await fetch("http://10.216.243.227:3001/clientes", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: dados
                });
                
                if (!resposta.ok) { 
                    throw new Error("Erro no servidor ao realizar cadastro.");
                }
                
                alert("Cliente cadastrado com sucesso!!!");
                window.location.href = "login.html";
            } catch(error) { 
                alert("Erro em cadastrar! " + error.message);
            } finally {
                btn_enviar.disabled = false;
                btn_enviar.value = "Cadastrar";
            }
        }
    </script>
    
    <script src="./pages.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
